# Sites (org/sites). Each references an rf_profile (bound via site.rftemplate_id)
# and a site_group (bound via site.sitegroup_ids, which is what makes it pick
# up the matching WLAN template through applies.sitegroup_ids). device_profile
# is listed for documentation only — see device_profiles.yaml for why it isn't
# bound here.
#
# site_defaults: per-site-group fallback values. A site only needs to state
# what's actually specific to it (name/address/timezone/vars) — rf_profile,
# device_profile, and country_code come from its site_group's defaults unless
# explicitly overridden on the site itself. This is what makes adding a new
# store a ~5 line entry instead of a full block.
#
# vars: Mist's native per-site template variables (confirmed live — see
# README). Any WLAN/network/gateway template field written as "{{key}}" gets
# resolved from the site's own vars at config-push time. BB-Retail-POS's psk
# is "{{pos_psk}}" in wlan_templates.yaml — one shared WLAN definition across
# every retail site, each broadcasting a different actual passphrase. The
# real pos_psk value per site lives in config/secrets.yaml (gitignored), not
# here — push.py merges it in before writing site.vars.
#
# latlng: the map pin. `address` is just a text label — Mist only derives
# latlng from it when a human geocodes it via the UI's "Location Search" box.
# Since we write sites via the API directly, we set latlng explicitly or the
# map falls back to a default location instead of the real site.

site_defaults:
  BB-SG-DistributionCenters:
    country_code: US
    rf_profile: BB-RF-DistributionCenter
    device_profile: BB-DP-DistributionCenter-AP
    network_template: BB-NT-DistributionCenter
  BB-SG-CorporateOffices:
    country_code: US
    rf_profile: BB-RF-CorporateOffice
    device_profile: BB-DP-CorporateOffice-AP
    network_template: BB-NT-CorporateOffice
  BB-SG-RetailStandalone:
    country_code: US
    rf_profile: BB-RF-RetailStandalone
    device_profile: BB-DP-Retail-AP
    network_template: BB-NT-Retail
  BB-SG-RetailMall:
    country_code: US
    rf_profile: BB-RF-RetailMall
    device_profile: BB-DP-Retail-AP
    network_template: BB-NT-Retail
  BB-SG-PopUpStores:
    country_code: US
    rf_profile: BB-RF-PopUp
    device_profile: BB-DP-PopUp-AP
    # No network_template — pop-ups weren't in scope for the wired build.

sites:

  - name: BB-DC-Dallas-01
    address: "Dallas, TX, USA"
    latlng: { lat: 32.7767, lng: -96.7970 }
    timezone: America/Chicago
    site_group: BB-SG-DistributionCenters
    notes: "BB retail lab - Distribution Center - safe to delete"

  - name: BB-DC-Reno-02
    address: "Reno, NV, USA"
    latlng: { lat: 39.5296, lng: -119.8138 }
    timezone: America/Los_Angeles
    site_group: BB-SG-DistributionCenters
    notes: "BB retail lab - Distribution Center (western regional DC) - safe to delete"

  - name: BB-Corp-Austin-HQ
    address: "Austin, TX, USA"
    latlng: { lat: 30.2672, lng: -97.7431 }
