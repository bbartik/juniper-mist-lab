    notes: "BB retail lab - Corporate HQ - safe to delete"

  - name: BB-Corp-Chicago-Regional
    address: "Chicago, IL, USA"
    latlng: { lat: 41.8781, lng: -87.6298 }
    timezone: America/Chicago
    site_group: BB-SG-CorporateOffices
